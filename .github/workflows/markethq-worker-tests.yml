name: MarketHQ Worker Tests

on:
  push:
    branches:
      - main
      - feature/cursor-operations-layer-v2-quality-final6
  pull_request:
    branches:
      - main

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run worker regression suite
        run: >-
          npx --yes tsx --test
          components/workers/autonomous-cycle-node-test.ts
          components/workers/autonomous-cycle-guard.node-test.ts
          components/workers/autonomous-cycle-controller-tests.ts
          components/workers/autonomous-cycle-coordinator-tests.ts
          components/workers/autonomous-cycle-coordinator-v2-tests.ts
          components/workers/autonomous-cycle-handoff-tests.ts
          components/workers/autonomous-cycle-2cycle-e2e.node-test.ts
          components/workers/autonomous-cycle-durable-handoff.node-test.ts
          components/workers/worker-runtime-regression.node-test.ts
          components/workers/cursor-worker-preflight.node-test.ts
          components/workers/cursor-worker-adapter-v1.node-test.ts
          components/workers/worker-runtime-cursor-e2e.node-test.ts
