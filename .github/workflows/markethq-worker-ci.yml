name: MarketHQ Worker CI

on:
  push:
    branches:
      - main
      - feature/cursor-operations-layer-v2-quality-final6
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify worker safety contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'researchOnly: true' components/workers/runtime-gate.ts
          grep -q 'automaticMerge: false' components/workers/runtime-gate.ts
          grep -q 'automaticPr: false' components/workers/runtime-gate.ts
          grep -q 'mutationAuthorized === true' components/workers/runtime-gate.ts
          grep -q 'targetPaths' components/workers/worker-task-builder.ts
          grep -q 'CursorWorkerPreflightBlockedError' components/workers/worker-runtime.ts
          grep -q 'dispatchAutonomousWorker' components/workers/autonomous-worker-orchestrator.ts
          grep -q 'IMPLEMENTATION_ONLY' components/workers/worker-research-handoff.ts
          grep -q 'coordinateAutonomousCycleV2' app/api/agents/orchestrator/route.ts
          grep -q 'buildWorkerResearchHandoff' app/api/agents/orchestrator/route.ts
          grep -q 'rehydrateWorkerFeedback' app/api/agents/orchestrator/route.ts
